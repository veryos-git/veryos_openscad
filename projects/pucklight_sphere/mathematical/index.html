<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeryOS mathematical sphere</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #151b1d; --panel: #192222; --line: #344040; --ink: #f7f2e6; --dim: #c7c8bc; --accent: #f0b750;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-columns: minmax(360px, 36%) 1fr;
    background: var(--bg); color: var(--ink);
    font: 13px/1.4 ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
  }
  button, select, input { font: inherit; color: inherit; }
  button, select { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }

  /* left: the shader */
  #left {
    position: relative; display: flex; flex-direction: column; gap: 10px; min-height: 0; height: 100vh;
    padding: 14px 16px; background: var(--panel); border-right: 1px solid var(--line);
  }
  #title { display: flex; justify-content: space-between; align-items: center; }
  #logo { width: 34px; color: var(--ink); }
  #template { width: 100%; padding: 6px 8px; }
  #editor { flex: 1 1 0; min-height: 120px; border: 1px solid var(--line); overflow: hidden; }
  #editor textarea {
    width: 100%; height: 100%; padding: 8px; border: 0; resize: none; outline: 0;
    background: #1e1e1e; color: var(--ink); font: inherit; white-space: pre; tab-size: 4;
  }
  #map { display: block; width: 100%; aspect-ratio: 2 / 1; max-height: 22vh; background: #000; }
  .slider { display: grid; grid-template-columns: 76px 1fr 40px; align-items: center; gap: 8px; }
  .slider output { text-align: right; color: var(--dim); }
  .slider select { grid-column: 2 / 4; padding: 2px 4px; }
  #sliders { display: flex; flex-direction: column; gap: 4px; }

  /* colours */
  #colors h2 { margin: 0; font: inherit; }
  #ends { display: flex; justify-content: space-between; margin-right: 38px; color: var(--dim); }
  #colors_row { display: flex; gap: 10px; align-items: center; padding: 0 7px; }
  #gradient { position: relative; flex: 1; height: 22px; border: 1px solid var(--line); touch-action: none; }
  #add_stop { width: 24px; height: 24px; padding: 0; }
  .stop {
    position: absolute; top: -3px; width: 14px; height: 26px; margin-left: -7px;
    border: 2px solid var(--ink); border-radius: 3px; outline: 1px solid #000; cursor: ew-resize; touch-action: none;
  }
  .stop.picked { border-color: var(--accent); }

  /* colour picker */
  #picker {
    position: absolute; left: 16px; bottom: 74px; z-index: 20; display: grid; width: 280px;
    grid-template-columns: 160px 1fr; gap: 10px; padding: 10px;
    background: var(--bg); border: 1px solid var(--accent); border-radius: 4px;
  }
  #picker[hidden] { display: none; }
  #picker_square { position: relative; height: 130px; cursor: crosshair; touch-action: none; }
  #picker_knob {
    position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; pointer-events: none;
    border: 2px solid #fff; border-radius: 50%; outline: 1px solid #000;
  }
  #picker_rgb { display: flex; flex-direction: column; gap: 6px; }
  #picker_rgb label { display: flex; gap: 6px; align-items: center; }
  #picker_rgb input { width: 100%; min-width: 0; padding: 2px 4px; background: var(--panel); border: 1px solid var(--line); }
  #picker_remove { margin-top: auto; padding: 2px 4px; }
  #picker_remove:disabled { opacity: .4; cursor: default; }
  #picker_hue_row { grid-column: 1 / 3; display: flex; gap: 8px; align-items: center; color: var(--dim); }
  #picker_hue { appearance: none; height: 10px; background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  #picker_hue::-webkit-slider-thumb { appearance: none; width: 8px; height: 16px; background: #fff; border: 1px solid #000; }
  #picker_hue::-moz-range-thumb { width: 8px; height: 16px; background: #fff; border: 1px solid #000; border-radius: 0; }

  /* right: the sphere */
  #right { position: relative; min-width: 0; height: 100vh; overflow: hidden; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #view:active { cursor: grabbing; }
  #status {
    position: absolute; left: 14px; top: 14px; max-width: calc(100% - 150px); padding: 8px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; pointer-events: none;
  }
  #status.busy { border-color: var(--accent); color: var(--accent); }
  #status.error { border-color: #e06c5a; color: #ffb4a8; }

  #cube_scene { position: absolute; right: 26px; top: 26px; width: 64px; height: 64px; pointer-events: none; }
  #cube { position: absolute; inset: 0; transform-style: preserve-3d; }
  #cube button {
    position: absolute; inset: 0; padding: 0; border-radius: 0; font-size: 12px; pointer-events: auto;
    background: var(--panel); border: 1px solid var(--dim); backface-visibility: hidden;
  }
  #cube button:hover { background: var(--line); color: var(--accent); }

  #download { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 4px; align-items: center; }
  #download span { margin-right: 6px; }
  #download button { padding: 8px 14px; }

  #views {
    position: absolute; right: 14px; bottom: 14px; display: grid; gap: 4px;
    grid-template-columns: repeat(2, min(20vh, 170px)); grid-auto-rows: min(20vh, 170px); pointer-events: none;
  }
  #views[hidden] { display: none; }
  .view { position: relative; border: 1px solid var(--line); }
  .view span { position: absolute; left: 6px; top: 3px; color: var(--dim); }
  #toggle_views { position: absolute; right: 22px; bottom: 22px; width: 30px; height: 30px; padding: 0; }
</style>
</head>
<body>
<section id="left">
  <div id="title">
    <label for="template">template</label>
    <svg id="logo" viewBox="0 0 43.9095293518 31.2528266758" role="img" aria-label="VeryOS logo"><path fill="currentColor" fill-rule="evenodd" d="M 7.7528133542 9.1080260785 L 4.6193976626 1.5432914191 L 0 3.4567085809 L 11.5135290962 31.2528266758 L 32.3960002556 31.2528266758 L 43.9095293518 3.4567085809 L 39.2901316892 1.5432914191 L 36.1567159975 9.1080260785 A 15.6264133379 15.6264133379 0 0 0 7.7528133542 9.1080260785 Z M 30.9694268093 21.2528266758 A 10.6264133379 10.6264133379 0 0 0 21.9547646759 5 A 4.0632066689 4.0632066689 0 0 0 21.9547646759 13.1264133379 A 9.0632066689 9.0632066689 0 0 1 30.9694268093 21.2528266758 Z M 12.9401025425 10 A 9.0632066689 9.0632066689 0 0 0 21.9547646759 18.1264133379 A 4.0632066689 4.0632066689 0 0 1 21.9547646759 26.2528266758 A 10.6264133379 10.6264133379 0 0 1 12.9401025425 10 Z"/></svg>
  </div>
  <select id="template"></select>
  <div id="editor"></div>
  <canvas id="map" width="1024" height="512" title="The heightmap: longitude from left to right, the top of the sphere at the top"></canvas>
  <div id="sliders">
    <div class="slider"><label for="scale">Scale</label><input id="scale" type="range" min="2" max="24" step="0.1" value="12"><output id="scale_value"></output></div>
    <div class="slider"><label for="seed">Seed</label><input id="seed" type="range" min="0" max="100" step="1" value="3"><output id="seed_value"></output></div>
    <div class="slider"><label for="gamma">gamma</label><input id="gamma" type="range" min="0.3" max="3" step="0.05" value="1"><output id="gamma_value"></output></div>
    <div class="slider" title="surface_depth in the generator: how far 1.0 stands out, in mm"><label for="depth">Depth mm</label><input id="depth" type="range" min="0.2" max="5" step="0.1" value="0.8"><output id="depth_value"></output></div>
    <div class="slider" title="sphere_columns in the generator: the mesh's resolution"><label for="columns">Columns</label>
      <select id="columns"><option>180</option><option>360</option><option selected>720</option></select>
    </div>
  </div>
  <div id="colors">
    <h2>Colors</h2>
    <div id="ends"><span>0.0</span><span>1.0</span></div>
    <div id="colors_row"><div id="gradient"></div><button id="add_stop" title="Add a colour">+</button></div>
  </div>
  <div id="picker" hidden>
    <div id="picker_square"><div id="picker_knob"></div></div>
    <div id="picker_rgb">
      <label>r <input id="picker_r" type="number" min="0" max="255"></label>
      <label>g <input id="picker_g" type="number" min="0" max="255"></label>
      <label>b <input id="picker_b" type="number" min="0" max="255"></label>
      <button id="picker_remove">remove</button>
    </div>
    <div id="picker_hue_row"><span>0</span><input id="picker_hue" type="range" min="0" max="360" step="1"><span>360</span></div>
  </div>
</section>
<section id="right">
  <canvas id="view"></canvas>
  <div id="status"></div>
  <div id="cube_scene"><div id="cube">
    <button data-az="-90" data-el="0" style="transform: translateZ(32px)">front</button>
    <button data-az="90" data-el="0" style="transform: rotateY(180deg) translateZ(32px)">back</button>
    <button data-az="180" data-el="0" style="transform: rotateY(-90deg) translateZ(32px)">left</button>
    <button data-az="0" data-el="0" style="transform: rotateY(90deg) translateZ(32px)">right</button>
    <button data-az="-90" data-el="90" style="transform: rotateX(90deg) translateZ(32px)">top</button>
    <button data-az="-90" data-el="-90" style="transform: rotateX(-90deg) translateZ(32px)">bottom</button>
  </div></div>
  <div id="download"><span>Download</span><button id="download_obj">.obj</button><button id="download_stl">.stl</button></div>
  <div id="views">
    <div class="view" id="view_front" data-az="-90" data-el="0"><span>front</span></div>
    <div class="view" id="view_top" data-az="-90" data-el="90"><span>top</span></div>
    <div class="view" id="view_left" data-az="180" data-el="0"><span>left</span></div>
  </div>
  <button id="toggle_views" title="Show or hide the front, top and left views">▼</button>
</section>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script src="sphere_mesh.js"></script>
<script src="app.js"></script>
</body>
</html>
